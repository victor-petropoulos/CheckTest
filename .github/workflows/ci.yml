name: ci
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --frozen-lockfile
      - run: npm run build
      # darwin-local flake: coverage run can exit 139 (SIGSEGV); rerun once before failing
      - run: npm test -- --coverage
      - name: checkchange gate (Option A)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          # Coverage artifact must exist: a crashed test step can leave none.
          if [ ! -f coverage/coverage-final.json ] && [ ! -f coverage/lcov.info ]; then
            echo "::warning::coverage artifact missing — checkchange skipped (self-disable)"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            BASE="origin/$BASE_REF"
          else
            BASE="$EVENT_BEFORE"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="master"
          fi
          echo "checkchange base ref: $BASE"
          CC_EXIT=0
          npx --yes checkchange@0.5.6 check --base "$BASE" --coverage-file coverage/coverage-final.json --json > cc.json || CC_EXIT=$?
          cat cc.json
          GATE=$(jq -r '.gate // "NOT_EVALUATED"' cc.json) || GATE=""
          echo "checkchange gate: $GATE (process exit $CC_EXIT)"
          case "$GATE" in
            PASS|NOT_EVALUATED) exit 0 ;;
            WARN|FAILED) exit 1 ;;
            *) echo "::error::unreadable checkchange gate (process exit $CC_EXIT)"; exit 1 ;;
          esac
      - run: npm run typecheck
      - name: format check
        run: |
          npm run format
          # package-lock.json legitimately differs from the dev repo: the tarball
          # ships without devDependencies, so `npm install` in CI regenerates the
          # lock. Compare only source files.
          git diff --exit-code -- src tests
      - name: smoke CLI
        run: node dist/src/cli.js --version && node dist/src/cli.js check --test tests/cli.test.ts --type UNIT > report.json && jq -e '.analysisStatus' report.json
      - name: rule catalog drift check
        run: |
          set -euo pipefail
          npx tsx scripts/gen-rule-catalog.ts
          git diff --exit-code -- docs/rules/catalog.md
      - name: markdown link check
        run: npx tsx scripts/check-doc-links.ts
